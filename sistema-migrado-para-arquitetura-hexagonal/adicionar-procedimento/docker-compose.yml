services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procedimento
      POSTGRES_USER: procedimento
      POSTGRES_PASSWORD: procedimento
    ports:
      - "5434:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./banco/dados.sql:/docker-entrypoint-initdb.d/02-dados.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procedimento -d procedimento"]
      interval: 3s
      retries: 30

  app:
    image: eclipse-temurin:17-jre
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/procedimento
      TZ: America/Sao_Paulo
    ports:
      - "8081:8081"
    volumes:
      - ./rest/target/aplicacao.jar:/app/aplicacao.jar:ro
    command: ["java", "-jar", "/app/aplicacao.jar"]

  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "4201:80"
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dados-postgres:
