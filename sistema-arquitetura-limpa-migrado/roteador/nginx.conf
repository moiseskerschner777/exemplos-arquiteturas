server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://web-spring:8082;
    }

    location ~* \.(js|css|ico)$ {
        try_files $uri =404;
    }

    location = /transferir {
        try_files /index.html =404;
    }

    location = /abrir-conta {
        try_files /index.html =404;
    }

    location = /depositar {
        try_files /index.html =404;
    }

    location = /sacar {
        try_files /index.html =404;
    }

    location = /encerrar-conta {
        try_files /index.html =404;
    }

    location = /extrato {
        try_files /index.html =404;
    }

    location / {
        proxy_pass http://tomcat:8080;
    }
}
