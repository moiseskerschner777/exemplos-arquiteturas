services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sistema
      POSTGRES_USER: sistema
      POSTGRES_PASSWORD: sistema
    ports:
      - "5435:5432"
    volumes:
      - ./adaptador-jpa-postgres/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema -d sistema"]
      interval: 3s
      retries: 30

  web-spring:
    image: eclipse-temurin:17-jre
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sistema
      DB_USER: sistema
      DB_PASSWORD: sistema
    ports:
      - "8082:8082"
    volumes:
      - ./web-spring/target/web-spring.jar:/app/web-spring.jar:ro
    command: ["java", "-jar", "/app/web-spring.jar"]

  roteador:
    image: nginx:1.27-alpine
    depends_on:
      - web-spring
    ports:
      - "8090:80"
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./roteador/nginx.conf:/etc/nginx/conf.d/default.conf:ro

