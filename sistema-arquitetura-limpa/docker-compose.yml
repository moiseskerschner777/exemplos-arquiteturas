services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: sistema
      APP_USER: sistema
      APP_USER_PASSWORD: sistema
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  tomcat:
    image: tomcat:9.0-jdk8
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: sistema
      DB_PASSWORD: sistema
    ports:
      - "8080:8080"
    volumes:
      - ./web-servlet/target/web-servlet-1.0.0.war:/usr/local/tomcat/webapps/ROOT.war

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sistema
      POSTGRES_USER: sistema
      POSTGRES_PASSWORD: sistema
    ports:
      - "5435:5432"
    volumes:
      - ./adaptador-jpa-postgres/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema -d sistema"]
      interval: 3s
      retries: 30

  web-spring:
    image: eclipse-temurin:17-jre
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PERFIL:-oracle}
      DB_URL: ${DB_URL_WEB_SPRING:-jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
      DB_USER: sistema
      DB_PASSWORD: sistema
    ports:
      - "8082:8082"
    volumes:
      - ./web-spring/target/web-spring.jar:/app/web-spring.jar:ro
    command: ["java", "-jar", "/app/web-spring.jar"]

  roteador:
    image: nginx:1.27-alpine
    depends_on:
      - tomcat
      - web-spring
    ports:
      - "8090:80"
    volumes:
      - ./frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./roteador/nginx.conf:/etc/nginx/conf.d/default.conf:ro

