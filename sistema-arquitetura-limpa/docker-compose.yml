services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: sistema
      APP_USER: sistema
      APP_USER_PASSWORD: sistema
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  tomcat:
    image: tomcat:9.0-jdk8
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: sistema
      DB_PASSWORD: sistema
    ports:
      - "8080:8080"
    volumes:
      - ./web-servlet/target/web-servlet-1.0.0.war:/usr/local/tomcat/webapps/ROOT.war
